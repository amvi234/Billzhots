# Pinned so the stack keeps its name regardless of the folder it is run from.
name: billzhots

services:
  db:
    image: postgres:16-alpine
    container_name: 'billzhots_postgres'
    environment:
      POSTGRES_DB: billzhots
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billzhots"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: 'billzhots_redis'
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: 'billzhots_backend'
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn ecommerce_backend.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment: &backend_env
      PYTHONUNBUFFERED: 1
      DJANGO_SETTINGS_MODULE: ecommerce_backend.settings
      DEBUG: "True"
      REDIS_URL: redis://redis:6379/0
      DB_NAME: billzhots
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: 'billzhots_celery_worker'
    command: celery -A ecommerce_backend worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    env_file:
      - ../.env
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: 'billzhots_frontend'
    command: npm run dev
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    environment:
      # Read by the browser, so it must point at the host-published backend port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    depends_on:
      - web

volumes:
  postgres_data:
    # Existing volume from when the stack lived under ecommerce_backend/.
    name: ecommerce_backend_postgres_data
  frontend_node_modules:
  frontend_next:
